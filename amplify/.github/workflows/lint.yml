name: React lint

on:
	push:
	pull_request:

jobs:
	lint:
		runs-on: ubuntu-latest
		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: npm

			- name: Install dependencies
				run: npm ci

			- name: Lint with critical-error threshold
				run: npm run lint -- --quiet
